<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>🐍 Con Rắn - Hoàn chỉnh</title>
<style>
body{margin:0;font-family:Arial,sans-serif;text-align:center;background:#111;color:#fff;position:relative;}
canvas{background:#222;margin:20px auto;display:block;border:3px solid #fff;border-radius:8px;}
#scoreboard{font-size:18px;margin-top:10px;}
button{background:#10b981;color:#fff;border:none;padding:10px 16px;border-radius:6px;cursor:pointer;margin:5px;}
#overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:10;display:none;}
</style>
</head>
<body>
<h1>🐍 Con Rắn</h1>
<div id="scoreboard">Điểm: <span id="score">0</span> | Kỷ lục: <span id="highscore">0</span></div>
<canvas id="gameCanvas" width="600" height="600"></canvas>
<div>
  <button id="btnPause">⏸️ Tạm dừng</button>
</div>

<div id="overlay">
  <h2>💀 Game Over</h2>
  <button id="btnRestart">Chơi lại</button>
</div>

<script>
const canvas=document.getElementById("gameCanvas");
const ctx=canvas.getContext("2d");
const box=30;
let snake=[{x:9*box,y:10*box},{x:8*box,y:10*box},{x:7*box,y:10*box},{x:6*box,y:10*box}];
let direction="RIGHT",nextDirection="RIGHT",score=0,speed=140,game=null,running=true;
let food={x:0,y:0};

const scoreEl=document.getElementById("score");
const highEl=document.getElementById("highscore");
const btnPause=document.getElementById("btnPause");
const overlay=document.getElementById("overlay");
const btnRestart=document.getElementById("btnRestart");

function placeFood(){
  let ok=false;
  while(!ok){
    const fx=Math.floor(Math.random()*(canvas.width/box))*box;
    const fy=Math.floor(Math.random()*(canvas.height/box))*box;
    ok=!snake.some(s=>s.x===fx&&s.y===fy);
    if(ok){food.x=fx;food.y=fy;break;}
  }
}

function updateScore(){
  scoreEl.textContent=score;
  highEl.textContent=localStorage.getItem("snakeHigh")||0;
}

function draw(){
  if(!running) return;
  direction=nextDirection;
  ctx.fillStyle="#111"; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="#ef4444"; ctx.fillRect(food.x+2,food.y+2,box-4,box-4);
  for(let i=0;i<snake.length;i++){
    ctx.fillStyle=(i===0)?"#34d399":"#10b981";
    ctx.fillRect(snake[i].x+1,snake[i].y+1,box-2,box-2);
    ctx.strokeStyle="rgba(0,0,0,0.3)";
    ctx.strokeRect(snake[i].x+1,snake[i].y+1,box-2,box-2);
  }

  let headX=snake[0].x,headY=snake[0].y;
  if(direction==="LEFT") headX-=box;
  if(direction==="UP") headY-=box;
  if(direction==="RIGHT") headX+=box;
  if(direction==="DOWN") headY+=box;

  const newHead={x:headX,y:headY};

  const hitWall=headX<0||headY<0||headX>=canvas.width||headY>=canvas.height;
  const hitBody=snake.some(seg=>seg.x===newHead.x&&seg.y===newHead.y);

  if(hitWall||hitBody){
    running=false; clearInterval(game);
    overlay.style.display="flex";
    const prevHigh=Number(localStorage.getItem("snakeHigh")||0);
    if(score>prevHigh) localStorage.setItem("snakeHigh",score);
    updateScore();
    return;
  }

  if(newHead.x===food.x&&newHead.y===food.y){
    snake.unshift(newHead);
    score++;
    if(score%5===0&&speed>60){speed=Math.max(60,speed-10);clearInterval(game);startLoop();}
    placeFood();
    updateScore();
  } else {snake.pop(); snake.unshift(newHead);}
}

function startLoop(){clearInterval(game);game=setInterval(draw,speed);running=true; overlay.style.display="none";}
function resetGame(){snake=[{x:9*box,y:10*box},{x:8*box,y:10*box},{x:7*box,y:10*box},{x:6*box,y:10*box}];direction="RIGHT";nextDirection="RIGHT";score=0;speed=140;running=true;updateScore();placeFood();startLoop();}

document.addEventListener('keydown',e=>{
  const k=e.key;
  if(k==='ArrowLeft'||k==='a'||k==='A'){if(direction!=='RIGHT')nextDirection='LEFT';e.preventDefault();}
  else if(k==='ArrowUp'||k==='w'||k==='W'){if(direction!=='DOWN')nextDirection='UP';e.preventDefault();}
  else if(k==='ArrowRight'||k==='d'||k==='D'){if(direction!=='LEFT')nextDirection='RIGHT';e.preventDefault();}
  else if(k==='ArrowDown'||k==='s'||k==='S'){if(direction!=='UP')nextDirection='DOWN';e.preventDefault();}
});

btnPause.addEventListener('click',()=>{
  if(running){running=false;clearInterval(game);btnPause.textContent="▶️ Tiếp tục";}
  else{running=true;startLoop();btnPause.textContent="⏸️ Tạm dừng";}
});

btnRestart.addEventListener('click',()=>{resetGame();btnPause.textContent="⏸️ Tạm dừng";});

placeFood();
updateScore();
startLoop();
</script>
</body>
</html>
